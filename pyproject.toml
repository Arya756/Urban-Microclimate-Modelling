[project]
name = "urbanwind"
version = "0.1.0"
description = "Surrogate models for pedestrian-level urban wind trained on the UrbanTALES large-eddy simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "optuna>=4.0",
    "shap>=0.46",
    "h5py>=3.11",
    "netcdf4>=1.7",
    "xarray>=2024.6",
    "f90nml>=1.4",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanwind"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["src/urbanwind/tests", "pipeline"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# E402: scripts set sys.path before importing; E702, B905: style only;
# B023: closures that are called inside the loop that defines them
ignore = ["E402", "E702", "B905", "B023"]
